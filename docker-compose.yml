services:
  postgres:
    image: postgres:16-alpine
    container_name: flight-reminder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_password
      POSTGRES_DB: flight_reminder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_reminder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: